<!DOCTYPE html>

  <head>

    <meta name="theme-color" content="#ff8a1e" />
    <title>Grassroots Plasma | Under Construction</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <main class="page-shell">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>

      <section class="card" aria-labelledby="title">
        <div class="header-row">
          <div class="text-wrap">
            <p class="eyebrow">Welcome to</p>
            <h1 id="title">Grassroots Plasma</h1>
          </div>

          <div class="gif-stack" aria-label="Lightning and community animation">
            <img
              src="https://cdn.fbsbx.com/v/t59.2708-21/633746231_1499026922015890_3452969380912053658_n.gif?_nc_cat=101&ccb=1-7&_nc_sid=9dcd69&_nc_ohc=5krQDZzurScQ7kNvwGhAHjy&_nc_oc=AdpF8EvP01uHzS15IT2tQkmcbByP0DOvkrNXA5OqeKWJFhVtGhsqdS0xdDWFPW0wOhg&_nc_zt=7&_nc_ht=cdn.fbsbx.com&_nc_gid=IjWUdotrjHtQeGBO7t-ilg&_nc_ss=7b689&oh=03_Q7cD6wFiXs0fVF8ydXIiys4UCoGsVD4EIFG4u_r_36pnug0GkA&oe=6AF7AA88"

            />
           
          </div>
        </div>

        <p class="status-line">Website under construction</p>

        <p class="tagline">
          Grassroots Plasma is building a community-powered home for education,
          connection, and action.
        </p>
        <p class="message">
          We’re gathering momentum, listening closely, and preparing a bold new
          chapter for the movement ahead.
        </p>
        <div class="status-row" aria-label="Status updates">
          <span class="status-pill">Lighting the way</span>
          <span class="status-pill">Building</span>
          <span class="status-pill">Coming soon</span>
        </div>
