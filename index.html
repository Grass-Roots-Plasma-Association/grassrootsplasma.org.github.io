<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grassroots Plasma is currently building its new website. Check back soon for updates."
    />
    <meta name="theme-color" content="#ff8a1e" />
    <title>Grassroots Plasma | Under Construction</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>

      <section class="card" aria-labelledby="title">
        <div class="header-row">
          <div class="text-wrap">
            <p class="eyebrow">Welcome to</p>
            <h1 id="title">Grassroots Plasma</h1>
          </div>

          <div class="gif-stack" aria-label="Plasma animation">
            <img
              src="https://pcrf.princeton.edu/wp-content/uploads/sites/772/2020/09/ezgif-7-7cfe22a5bac5-1.gif"
              alt="Animated plasma illustration"
            />
          </div>
        </div>

        <p class="status-line">Website under construction</p>

        <p class="tagline">
          Grassroots Plasma is building a community-powered home for education,
          connection, and action.
        </p>
        <p class="message">
          We’re gathering momentum, listening closely, and preparing a bold new
          chapter for the movement ahead.
        </p>
        <div class="status-row" aria-label="Status updates">
          <span class="status-pill">Lighting the way</span>
          <span class="status-pill">Building</span>
          <span class="status-pill">Coming soon</span>
        </div>
      </section>
    </main>
  </body>
</html>
