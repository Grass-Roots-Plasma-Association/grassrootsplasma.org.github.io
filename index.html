<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grassroots Plasma is currently building its new website. Check back soon for updates."
    />
    <title>Grassroots Plasma | Under Construction</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    />

  <body>
    <main class="page-shell">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>

      <section class="card" aria-labelledby="title">
        <p class="eyebrow">Grassroots Plasma</p>

        <p class="tagline">

        <p class="message">
          Check back soon for updates, events, and ways to get involved.
        </p>
        <div class="status-row" aria-label="Status updates">
          <span class="status-pill">Website</span>
          <span class="status-pill">Coming soon</span>
        </div>
      </section>
